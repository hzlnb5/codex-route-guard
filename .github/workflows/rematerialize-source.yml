name: Rematerialize audited source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'verify/initial-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Rebuild standalone source from audited upstream material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          mkdir -p .materialize/source

          curl -fsSL https://raw.githubusercontent.com/hzlnb5/cockpit-tools/main/tools/codex-webgpt-guard/source.zip -o .materialize/source.zip
          curl -fsSL https://raw.githubusercontent.com/hzlnb5/cockpit-tools/main/tools/codex-webgpt-guard/hardening-v2.patch -o .materialize/hardening-v2.patch

          unzip -q .materialize/source.zip -d .materialize/source
          git apply --whitespace=nowarn --directory=.materialize/source -p2 .materialize/hardening-v2.patch

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".materialize/source")

          p = root / "main.go"
          s = p.read_text()

          s = s.replace(
              'appDirName       = "CodexWebGPTGuard"\n\trunRegistryName  = "CodexWebGPTGuard"',
              'appDirName             = "CodexRouteGuard"\n\trunRegistryName        = "CodexRouteGuard"\n\tlegacyAppDirName       = "CodexWebGPTGuard"\n\tlegacyRunRegistryName  = "CodexWebGPTGuard"',
          )
          s = s.replace(
              'usage: codex-webgpt-guard.exe mode auto|web|native',
              'usage: codex-route-guard.exe mode auto|web|native',
          )
          s = s.replace('Codex WebGPT Guard:', 'Codex Route Guard:')
          s = s.replace('fmt.Println("Codex WebGPT Guard")', 'fmt.Println("Codex Route Guard")')
          s = s.replace(
              'dst := filepath.Join(d, "codex-webgpt-guard.exe")',
              'dst := filepath.Join(d, "codex-route-guard.exe")',
          )

          log_pat = re.compile(
              r'func logPath\(\) string \{\n\s*d, _ := appDir\(\)\n\s*return filepath\.Join\(d, "guard\.log"\)\n\}',
              re.M,
          )
          legacy_helpers = r'''func logPath() string {
          d, _ := appDir()
          return filepath.Join(d, "guard.log")
          }

          func legacyAppDir() string {
          base := strings.TrimSpace(os.Getenv("LOCALAPPDATA"))
          if base == "" {
          return ""
          }
          return filepath.Join(base, legacyAppDirName)
          }

          func legacySettingsPath() string {
          d := legacyAppDir()
          if d == "" {
          return ""
          }
          return filepath.Join(d, "settings.json")
          }

          func legacyStopPath() string {
          d := legacyAppDir()
          if d == "" {
          return ""
          }
          return filepath.Join(d, "stop.request")
          }

          func loadLegacySettings() (settings, bool) {
          p := legacySettingsPath()
          if p == "" {
          return settings{}, false
          }
          b, err := os.ReadFile(p)
          if err != nil {
          return settings{}, false
          }
          var s settings
          if json.Unmarshal(b, &s) != nil {
          return settings{}, false
          }
          s.Mode = normalizeMode(s.Mode)
          return s, true
          }

          func stopLegacyGuard() {
          if runtime.GOOS != "windows" {
          return
          }
          if p := legacyStopPath(); p != "" {
          _ = os.MkdirAll(filepath.Dir(p), 0700)
          _ = os.WriteFile(p, []byte(time.Now().Format(time.RFC3339Nano)), 0600)
          }
          _ = regDeleteRun(legacyRunRegistryName)
          }'''
          s, n = log_pat.subn(legacy_helpers, s, count=1)
          if n != 1:
              raise SystemExit(f"logPath transformation count={n}")

          install_pat = re.compile(
              r'(func install\(\) error \{\n\s*if runtime\.GOOS != "windows" \{\n\s*return errors\.New\("install is Windows-only"\)\n\s*\}\n)',
              re.M,
          )
          install_extra = r'''
          // Migrate the older CodexWebGPTGuard package if it is installed. The old daemon
          // used a different install directory, startup value and mutex, so stop it before
          // starting Codex Route Guard to avoid two reconcilers touching the same config.
          stopLegacyGuard()
          time.Sleep(500 * time.Millisecond)
          '''
          s, n = install_pat.subn(lambda m: m.group(1) + install_extra, s, count=1)
          if n != 1:
              raise SystemExit(f"install transformation count={n}")

          settings_pat = re.compile(
              r'if _, err := os\.Stat\(settingsPath\(\)\); errors\.Is\(err, os\.ErrNotExist\) \{\n\s*if err := saveSettings\(settings\{Mode: defaultMode\}\); err != nil \{\n\s*return err\n\s*\}\n\s*\}',
              re.M,
          )
          settings_repl = r'''if _, err := os.Stat(settingsPath()); errors.Is(err, os.ErrNotExist) {
          initial := settings{Mode: defaultMode}
          if legacy, ok := loadLegacySettings(); ok {
          initial = legacy
          }
          if err := saveSettings(initial); err != nil {
          return err
          }
          }'''
          s, n = settings_pat.subn(settings_repl, s, count=1)
          if n != 1:
              raise SystemExit(f"settings migration count={n}")

          if 'var version = "dev"' not in s:
              s = s.replace(
                  'var managedCatalogNames = map[string]bool{',
                  'var version = "dev"\n\nvar managedCatalogNames = map[string]bool{',
              )

          help_pat = re.compile(
              r'case "help", "-h", "--help":\n\s*printHelp\(\)\n\s*return',
              re.M,
          )
          help_repl = '''case "version", "--version", "-v":
          fmt.Println(version)
          return
          case "help", "-h", "--help":
          printHelp()
          return'''
          s, n = help_pat.subn(help_repl, s, count=1)
          if n != 1:
              raise SystemExit(f"version command count={n}")

          s = s.replace(
              'fmt.Println("  install        install for current user and enable autostart")',
              'fmt.Println("  version        print build version")\n\tfmt.Println("  install        install for current user and enable autostart")',
          )
          p.write_text(s)

          p = root / "platform_windows.go"
          p.write_text(
              p.read_text().replace(
                  "Local\\\\CodexWebGPTGuard-v1",
                  "Local\\\\CodexRouteGuard-v1",
              )
          )

          p = root / "go.mod"
          p.write_text(
              p.read_text().replace(
                  "module github.com/hzlnb5/codex-webgpt-guard",
                  "module github.com/hzlnb5/codex-route-guard",
              )
          )

          p = root / "main_test.go"
          s = p.read_text()
          if "TestLoadLegacySettingsForMigration" not in s:
              s += r'''
          func TestLoadLegacySettingsForMigration(t *testing.T) {
          root := t.TempDir()
          t.Setenv("LOCALAPPDATA", root)
          legacyDir := filepath.Join(root, legacyAppDirName)
          if err := os.MkdirAll(legacyDir, 0700); err != nil {
          t.Fatal(err)
          }
          if err := os.WriteFile(filepath.Join(legacyDir, "settings.json"), []byte(`{"mode":"web"}`), 0600); err != nil {
          t.Fatal(err)
          }
          got, ok := loadLegacySettings()
          if !ok || got.Mode != "web" {
          t.Fatalf("legacy settings migration failed: ok=%t mode=%q", ok, got.Mode)
          }
          }
          '''
          p.write_text(s)
          PY
          (
            cd .materialize/source
            gofmt -w *.go
            go test ./... -count=1
            go vet ./...
            GOOS=windows GOARCH=amd64 go test -c -o ../windows-tests.exe .
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=materialized" -o ../codex-route-guard.exe .
          )

          cp .materialize/source/main.go .
          cp .materialize/source/main_test.go .
          cp .materialize/source/platform_windows.go .
          cp .materialize/source/platform_windows_test.go .
          cp .materialize/source/platform_stub.go .
          cp .materialize/source/go.mod .

          grep -q 'recoverFreshCodexLaunch(beforeConnect.ModTime)' main.go
          grep -q 'd.Kind != "codex-web-gpt-launcher"' main.go
          grep -q 'freshCodexRecoveryScript' platform_windows.go
          ! grep -q 'Get-Process ChatGPT,Codex -ErrorAction SilentlyContinue | Stop-Process' platform_windows.go

          rm -rf .materialize

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.go' go.mod; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.go' go.mod
          git commit -m "fix: materialize complete audited standalone source"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

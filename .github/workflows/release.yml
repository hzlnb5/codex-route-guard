name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test and vet
        shell: pwsh
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/codex-route-guard.exe .
          Copy-Item INSTALL.cmd dist/
          Copy-Item STATUS.cmd dist/
          Copy-Item UNINSTALL.cmd dist/
          Copy-Item README.md dist/
          Copy-Item README.zh-CN.md dist/
          Copy-Item LICENSE dist/
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-route-guard.exe).Hash.ToLowerInvariant()
          "$hash  codex-route-guard.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Compress-Archive -Force dist/* codex-route-guard-windows-x64.zip
          (Get-FileHash -Algorithm SHA256 codex-route-guard-windows-x64.zip).Hash.ToLowerInvariant() |
            ForEach-Object { "$_  codex-route-guard-windows-x64.zip" } |
            Set-Content -Encoding ascii RELEASE-SHA256SUMS.txt

      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\codex-route-guard.exe version
          .\dist\codex-route-guard.exe help

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            codex-route-guard-windows-x64.zip
            RELEASE-SHA256SUMS.txt
